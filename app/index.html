<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>⚔ Tekton Agent OS</title>
<style>
  :root { --bg:#0b0d10; --panel:rgba(255,255,255,0.05); --line:rgba(255,255,255,0.11); --gold:#d6cfbf; --txt:#f4f5f7; --dim:#c7ccd4; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 18px 6px; border-bottom:1px solid var(--line); display:flex; gap:18px; align-items:center; }
  header pre { font-size:9px; line-height:1.15; color:var(--gold); opacity:.85; }
  h1 { font-size:15px; color:var(--gold); letter-spacing:4px; }
  .sub { color:var(--dim); font-size:11px; }
  nav { display:flex; gap:2px; padding:8px 18px 0; }
  nav button { background:none; border:1px solid var(--line); border-bottom:none; color:var(--dim); padding:7px 16px; cursor:pointer; font:inherit; }
  nav button.on { color:var(--text); background:var(--panel); box-shadow:inset 0 -2px 0 var(--text); }
  main { flex:1; overflow:auto; padding:16px 18px; background:var(--panel); border-top:1px solid var(--line); }
  .card { border:1px solid var(--line); background:var(--bg); padding:12px 14px; margin-bottom:10px; cursor:pointer; }
  .card:hover { border-color:var(--gold); }
  .card b { color:var(--gold); } .card small { color:var(--dim); display:block; }
  input,textarea,select { background:var(--bg); color:var(--txt); border:1px solid var(--line); padding:8px 10px; font:inherit; width:100%; }
  button.gold { background:var(--gold); color:#14110a; border:none; padding:8px 18px; cursor:pointer; font:inherit; font-weight:700; }
  .msg { margin-bottom:10px; padding:9px 12px; border:1px solid var(--line); white-space:pre-wrap; }
  .bubble-you { background:rgba(214,207,191,0.06); border-left:3px solid var(--gold); } .bubble-agent { background:rgba(143,199,160,0.05); border-left:3px solid #8fc7a0; }
  .chip { display:inline-block; border:1px solid var(--line); padding:3px 10px; margin:3px; color:var(--dim); }
  .chip b { color:var(--txt); font-weight:500; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .dim { color:var(--dim); font-size:12px; }
  .err { color:#d98d8d; }
  .ok  { color:#8fc7a0; }
</style>
</head>
<body>
<header>
  <pre>
   ▄▄██▄▄        ⚔
  ▟██████▙       █
  █ ◉  ◉ █      ╔╩╗
  ▜██████▛     ▐█ █▌
   ▐████▌     ▐█ █▌
   ▄████████▄▐█ █▌
 ▐██████████████▌
  ▀▀▀ THE STONE ▀▀
  </pre>
  <div>
    <h1>T E K T O N</h1>
    <div class="sub">AGENT OS — sessions · projects · software · models · chat from anywhere</div>
  </div>
</header>
<nav id="tabs">
  <button data-t="chat" class="on">Chat</button>
  <button data-t="sessions">Sessions</button>
  <button data-t="projects">Projects</button>
  <button data-t="models">Models</button>
  <button data-t="health">Health</button>
  <button data-t="settings">⚙</button>
</nav>
<main id="view"></main>
<script>
const { invoke } = window.__TAURI__.core;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const gw = () => localStorage.getItem("tekton_gateway") || "http://127.0.0.1:8080";
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); render(b.dataset.t);
});
async function render(t) {
  const v = $("#view");
  if (t === "chat") return viewChat(v);
  if (t === "sessions") return viewSessions(v);
  if (t === "projects") return viewProjects(v);
  if (t === "models") return viewModels(v);
  if (t === "health") return viewHealth(v);
  if (t === "settings") return viewSettings(v);
}
function speakText(t) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  const vName = localStorage.getItem("tekton_voice");
  const v = speechSynthesis.getVoices().find(x => x.name === vName);
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function viewChat(v) {
  v.innerHTML = `<div id="log" style="height:calc(100% - 120px);overflow:auto"></div>
    <div class="row"><input id="say" placeholder="Speak to Tekton..." />
    <button class="gold" id="send">Send ⚔</button></div>
    <div class="dim">gateway: <span id="gws"></span></div>`;
  $("#gws").textContent = gw();
  const log = $("#log");
  const push = (role, txt) => { const d = document.createElement("div");
    d.className = "msg " + (role === "user" ? "bubble-you" : "bubble-agent"); d.textContent = txt;
    log.appendChild(d); log.scrollTop = log.scrollHeight; if (role === "assistant" && localStorage.getItem("tekton_speak") === "1") speakText(txt); };
  const send = async () => {
    const t = $("#say").value.trim(); if (!t) return; $("#say").value = "";
    push("user", t);
    try {
      const r = await invoke("http_json", { method: "POST", url: gw() + "/chat", body: { message: t } });
      const txt = r?.content ?? r?.message ?? r?.response ?? r?.text ?? r?.result ?? JSON.stringify(r, null, 2);
      push("assistant", typeof txt === "string" ? txt : JSON.stringify(txt, null, 2));
      if ((r?._status ?? 200) >= 400) log.lastChild.classList.add("err");
    } catch (e) { push("assistant", "✗ gateway unreachable: " + e + "\n(tekton --gateway? tunnel URL? see gear settings)"); log.lastChild.classList.add("err"); }
  };
  $("#send").onclick = send;
  $("#say").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
}
async function viewSessions(v) {
  v.innerHTML = "<div class='dim'>loading sessions…</div>";
  try {
    const ss = await invoke("list_sessions");
    if (!ss.length) { v.innerHTML = "<div class='dim'>no sessions yet in ~/.tekton/sessions</div>"; return; }
    v.innerHTML = ss.map((s, i) => `
      <div class="card" data-i="${i}">
        <b>${esc(s.title ?? "untitled")}</b>
        <small>${esc(s.model ?? "?")} · ${s.messages?.length ?? 0} msgs · ${esc((s.modified ?? s.created ?? "").slice(0, 19).replace("T", " "))}</small>
      </div>`).join("");
    v.querySelectorAll(".card").forEach(c => c.onclick = () => openSession(ss[c.dataset.i]));
  } catch (e) { v.innerHTML = "<div class='err'>✗ " + esc(String(e)) + "</div>"; }
}
function openSession(s) {
  const v = $("#view");
  v.innerHTML = `<button class="gold" onclick="render('sessions')">← back</button><h1 style="margin:10px 0">${esc(s.title ?? "session")}</h1>` +
    (s.messages ?? []).map(m => `<div class="msg ${m.role === "user" ? "bubble-you" : "bubble-agent"}"><b>${m.role}</b>\n${esc(String(m.content ?? ""))}</div>`).join("");
}
async function viewProjects(v) {
  v.innerHTML = "<div class='dim'>loading projects…</div>";
  try {
    const j = await invoke("read_json", { path: "projects.json" });
    const ps = Object.values(j?.projects ?? {});
    v.innerHTML = ps.length ? ps.map(p => `
      <div class="card"><b>${esc(p.name ?? "?")}</b> <span class="chip">${esc(p.project_type ?? "")}</span>
      <small>${esc(p.description ?? "")}</small><small class="dim">${esc(p.path ?? "")}</small></div>`).join("")
      : "<div class='dim'>no projects registered (projects.json)</div>";
  } catch (e) { v.innerHTML = "<div class='dim'>no projects.json — run the project-registry skill to populate</div>"; }
}
async function viewModels(v) {
  v.innerHTML = "<div class='dim'>loading models…</div>";
  try {
    const j = await invoke("read_json", { path: "models.json" });
    v.innerHTML = Object.entries(j?.providers ?? {}).map(([name, p]) => `
      <div class="card"><b>${esc(name)}</b> <small>${esc(p.baseUrl ?? "")} · ${esc(p.api ?? "")}</small><div>
      ${(p.models ?? []).map(m => `<span class="chip"><b>${esc(m.id ?? m)}</b></span>`).join("")}</div></div>`).join("");
  } catch (e) { v.innerHTML = "<div class='err'>✗ models.json unreadable</div>"; }
}
async function viewHealth(v) {
  v.innerHTML = "<div class='dim'>probing gateway…</div>";
  try {
    const r = await invoke("http_json", { method: "GET", url: gw() + "/health" });
    v.innerHTML = `<div class="ok">▲ gateway ${esc(gw())} — status ${r?._status ?? "?"}</div><pre style="margin-top:10px">${esc(JSON.stringify(r, null, 2))}</pre>`;
  } catch (e) {
    v.innerHTML = "<div class='err'>✗ gateway unreachable: " + esc(String(e)) +
      "</div><div class='dim'>start it with <b>tekton --gateway</b>; for remote: <b>cloudflared tunnel --url http://localhost:8080</b> then set the URL in ⚙</div>";
  }
}
function viewSettings(v) {
  v.innerHTML = `
    <div class="card"><b>Voice</b><small>choose the TTS voice for spoken replies (browser voices; the voice ENGINE adds neural TTS via --engines voice)</small>
      <div class="row"><select id="voice-sel" style="flex:1"></select><button class="gold" id="voice-test">Test</button></div>
      <div class="row"><label class="dim"><input type="checkbox" id="speak-on" /> speak assistant replies</label></div></div>
    <div class="card"><b>Gateway URL</b><small>tekton --gateway · or a cloudflared tunnel URL to chat remotely</small>
      <div class="row"><input id="gw-in" value="${esc(gw())}" /><button class="gold" id="gw-save">Save</button></div></div>
    <div class="card"><b>Tekton home</b><small id="thm">${esc(home || "…")}</small></div>
    <div class="card"><b>Chat from anywhere</b><small>1) tekton --gateway&nbsp;&nbsp;2) cloudflared tunnel --url http://localhost:8080&nbsp;&nbsp;3) set the tunnel URL above — phone browser or this app, anywhere.</small></div>`;
  $("#gw-save").onclick = () => { localStorage.setItem("tekton_gateway", $("#gw-in").value.trim()); render("settings"); };
  const vs = $("#voice-sel");
  const populateVoices = () => {
    if (!window.speechSynthesis) { vs.innerHTML = "<option>no speech synthesis in this webview</option>"; return; }
    vs.innerHTML = speechSynthesis.getVoices().map(v => `<option ${localStorage.getItem("tekton_voice") === v.name ? "selected" : ""}>${esc(v.name)}</option>`).join("");
  };
  populateVoices();
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if ($("#voice-sel")) populateVoices(); };
  $("#speak-on").checked = localStorage.getItem("tekton_speak") === "1";
  $("#speak-on").onchange = e => localStorage.setItem("tekton_speak", e.target.checked ? "1" : "0");
  vs.onchange = () => localStorage.setItem("tekton_voice", vs.value);
  $("#voice-test").onclick = () => speakText("Tekton Agent OS voice ready. The blade is drawn.");
}
(async () => { try { home = await invoke("tekton_home_path"); } catch {} render("chat"); })();
</script>
</body>
</html>
