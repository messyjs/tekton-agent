[package]
name = "tekton-agent-os"
version = "0.1.0"
description = "⚔ Tekton Agent OS — your sessions, projects, software and models"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri  = { version = "2", features = [] }
serde  = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest    = { version = "0.12", features = ["json", "rustls-tls"] }
dirs       = "5"

[profile.release]
strip = true
lto = true
